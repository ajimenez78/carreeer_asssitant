name: career-assistant-local

services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      CAREER_APP_NAME: ${CAREER_APP_NAME:-Career assistant}
      CAREER_POSTGRES_HOST: db
      CAREER_POSTGRES_PASSWORD: ${CAREER_POSTGRES_PASSWORD:-local-development-only}
      CAREER_DOCUMENT_DIRECTORY: /data/documents
      CAREER_SESSION_SECRET: ${CAREER_SESSION_SECRET:-}
      CAREER_SESSION_SECURE: ${CAREER_SESSION_SECURE:-false}
      CAREER_ALLOWED_ORIGINS: ${CAREER_ALLOWED_ORIGINS:-["http://127.0.0.1:8000","http://localhost:8000","http://127.0.0.1:3000","http://localhost:3000"]}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CAREER_AI_MODEL: ${CAREER_AI_MODEL:-gpt-6-luna}
      CAREER_AI_REASONING_EFFORT: ${CAREER_AI_REASONING_EFFORT:-low}
      CAREER_AI_TIMEOUT_SECONDS: ${CAREER_AI_TIMEOUT_SECONDS:-60}
      CAREER_AI_MAX_INPUT_TOKENS: ${CAREER_AI_MAX_INPUT_TOKENS:-20000}
      CAREER_AI_MAX_OUTPUT_TOKENS: ${CAREER_AI_MAX_OUTPUT_TOKENS:-2000}
    volumes:
      - document_data:/data/documents
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: career
      POSTGRES_USER: career
      POSTGRES_PASSWORD: ${CAREER_POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  document_data:
