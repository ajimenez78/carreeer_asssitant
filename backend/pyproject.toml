[project]
name = "career-assistant-backend"
version = "0.1.0"
description = "Python API for the career assistant"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.123",
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "openai>=3.42.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "pwdlib[argon2]>=0.3.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["career_assistant"]
branch = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.3",
]
