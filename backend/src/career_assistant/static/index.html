<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Career assistant — Backend check</title>
    <style>
      body { margin: 3rem auto; max-width: 42rem; padding: 0 1rem; font-family: system-ui, sans-serif; line-height: 1.6; }
      button { padding: 0.6rem 1rem; font: inherit; cursor: pointer; }
      output { display: block; margin: 1rem 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, world!</h1>
      <p>The career assistant backend is running.</p>
      <output id="api-status" aria-live="polite">Checking API…</output>
      <button id="check-api" type="button">Check API</button>
      <p><a href="/docs">API documentation</a></p>
    </main>
    <script>
      const status = document.querySelector("#api-status");
      const button = document.querySelector("#check-api");

      async function checkApi() {
        button.disabled = true;
        status.textContent = "Checking API…";
        try {
          const response = await fetch("/api/health", { cache: "no-store" });
          if (!response.ok) throw new Error("Health check failed");
          const health = await response.json();
          if (health.status !== "ok") throw new Error("Unexpected health response");
          status.textContent = "API status: ok";
        } catch {
          status.textContent = "Could not reach the API. Try again.";
        } finally {
          button.disabled = false;
        }
      }

      button.addEventListener("click", checkApi);
      checkApi();
    </script>
  </body>
</html>
